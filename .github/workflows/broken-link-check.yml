on:
  schedule:
    - cron: '*/5 * * * *' # run every 5 mins

name: Check markdown links
jobs:
  my-broken-link-checker:
    name: Check broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: ruzickap/action-my-broken-link-checker@v2.2.0
        with:
          url: https://claudiofus.github.io/
          cmd_params: "--one-page-only --color=always"  # Check just one page
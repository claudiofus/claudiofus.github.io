on:
  schedule:
    - cron: '05 12 * * 0' # At 11:30 on Sunday.

name: Check markdown links
jobs:
  my-broken-link-checker:
    name: Check broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: ruzickap/action-my-broken-link-checker@v2.5.0
        with:
          url: https://claudiofus.github.io/
          cmd_params: "--one-page-only --color=always --exclude=linkedin.com --exclude=fonts.googleapis.com --verbose --skip-tls-verification"  # Check just one page
          debug: true

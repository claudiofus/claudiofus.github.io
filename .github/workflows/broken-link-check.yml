on:
  schedule:
     - cron: '*/5 * * * *' # At 12:10 on Sunday.
#    - cron: '20 12 * * 0' # At 12:10 on Sunday.

name: Check markdown links
jobs:
  my-broken-link-checker:
    name: Check broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check
        uses: ruzickap/action-my-broken-link-checker@v2.5.0
        with:
          url: https://claudiofus.github.io/
          cmd_params: "--buffer-size=16384 --one-page-only --color=always --exclude=claudiofus.github.io/Menu%20panini%20senza%20prezzi.pdf --exclude=linkedin.com --exclude=fonts.googleapis.com --verbose --skip-tls-verification"  # Check just one page
          debug: true
